<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ad"></p>
    <script>
        // array
        const arr = ["car1", "car2", "car3"]
        let text=" "
        for(let i=0; i<arr.length; i++){
            text+=arr[i] + "<br>";
        }
        document.getElementById("ad").innerHTML = text

    </script>
</body>
</html>
