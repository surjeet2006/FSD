<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            width: 500px;
            height: 600px;
            border: 2px solid black;
            margin: auto;
            border-radius: 15px;
            background-color: aqua;
            padding: 20px;
        }
        h1{
            color: red;
        }
    </style>
</head>
<body>
    <form action="/x" id="myform"> 
        <h1>Student Registration Form</h1>
        <div><label for="name">Name: <input type="text" id="name" ></label></div> <br> 
        <div><label for="roll">Roll No: <input type="number" id="roll"></label></div> <br>
        <div><label for="branch">Branch: <input type="text" id="branch"></label></div> <br>
        <div>
            <label for="sec">Section:
                <select name="section" id="sec">
                    <option value="25">26</option>
                    <option value="25">27</option>
                    <option value="25">28</option>
                </select>
            </label>
        </div> <br>
        
        <div><label for="dob">DOB: <input type="date" name="dob"></label></div> <br>
        
        <div>Gender: 
            <div>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
            </div>
            <div>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </div>
        </div> <br>

        <div><label for="phone">Phone: <input type="number" id="phone"></label></div> <br>
        <div><label for="email">Email: <input type="email" id="email"></label></div> <br>
        <button type="submit">submit</button>
         
    </form>

    <script>
        const form = document.getElementById('myform')
        
    </script>
</body>
</html>
